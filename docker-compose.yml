# EcoTender AI — local / hackathon stack
# Production-shaped: same services scale out later on K8s

name: ecotender

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecotender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecotender}
      POSTGRES_DB: ${POSTGRES_DB:-ecotender}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecotender} -d ${POSTGRES_DB:-ecotender}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Host 9100/9101 — avoid clash with other MinIO (e.g. pdf-to-excel on 9000)
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/ecotender-raw || true;
      mc mb -p local/ecotender-models || true;
      exit 0;
      "

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecotender}:${POSTGRES_PASSWORD:-ecotender}@postgres:5432/${POSTGRES_DB:-ecotender}
      REDIS_URL: redis://redis:6379/0
      TENDER_SERVICE_URL: http://tender-service:8001
      MARKET_SERVICE_URL: http://market-service:8002
      GEO_SERVICE_URL: http://geo-service:8003
      RISK_SERVICE_URL: http://risk-engine:8004
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-${JWT_SECRET:-change-me-in-production}}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RUNTIME_CONFIG_PATH: /data/runtime/config.json
    volumes:
      - ./data/runtime:/data/runtime
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tender-service:
        condition: service_started
      market-service:
        condition: service_started
      geo-service:
        condition: service_started
      risk-engine:
        condition: service_started

  tender-service:
    build:
      context: .
      dockerfile: services/tender-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecotender}:${POSTGRES_PASSWORD:-ecotender}@postgres:5432/${POSTGRES_DB:-ecotender}
      REDIS_URL: redis://redis:6379/0
      SERVICE_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-service:
    build:
      context: .
      dockerfile: services/market-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecotender}:${POSTGRES_PASSWORD:-ecotender}@postgres:5432/${POSTGRES_DB:-ecotender}
      SERVICE_PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  geo-service:
    build:
      context: .
      dockerfile: services/geo-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecotender}:${POSTGRES_PASSWORD:-ecotender}@postgres:5432/${POSTGRES_DB:-ecotender}
      SERVICE_PORT: 8003
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  risk-engine:
    build:
      context: .
      dockerfile: services/risk-engine/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecotender}:${POSTGRES_PASSWORD:-ecotender}@postgres:5432/${POSTGRES_DB:-ecotender}
      REDIS_URL: redis://redis:6379/0
      # Own CatBoost scores; LLM explains via external API (OpenAI-compatible)
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-terra}
      MODEL_PATH: /models/catboost_risk_v1.cbm
      RUNTIME_CONFIG_PATH: /data/runtime/config.json
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-${JWT_SECRET:-change-me-in-production}}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-ecotender-raw}
      SERVICE_PORT: 8004
    ports:
      - "8004:8004"
    volumes:
      - ./ml/models:/models:ro
      - ./data/runtime:/data/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion-workers/Dockerfile
    command: celery -A app.workers.celery_app worker -l INFO -Q ingest,default
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecotender}:${POSTGRES_PASSWORD:-ecotender}@postgres:5432/${POSTGRES_DB:-ecotender}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-ecotender-raw}
      TENDER_SERVICE_URL: http://tender-service:8001
      MARKET_SERVICE_URL: http://market-service:8002
      GOSZAKUP_TOKEN: ${GOSZAKUP_TOKEN:-}
      GOSZAKUP_BASE_URL: ${GOSZAKUP_BASE_URL:-https://ows.goszakup.gov.kz}
      GOSZAKUP_PAGE_LIMIT: ${GOSZAKUP_PAGE_LIMIT:-50}
      GOSZAKUP_MAX_PAGES: ${GOSZAKUP_MAX_PAGES:-3}
      GOSZAKUP_USE_PLAYWRIGHT: ${GOSZAKUP_USE_PLAYWRIGHT:-true}
      GOSZAKUP_PW_BROWSE_RECENT: ${GOSZAKUP_PW_BROWSE_RECENT:-false}
      GOSZAKUP_PW_REGION_ONLY: ${GOSZAKUP_PW_REGION_ONLY:-mangystau}
      GOSZAKUP_PW_FILTER_KATO: ${GOSZAKUP_PW_FILTER_KATO:-470000000}
      GOSZAKUP_PW_PRESETS: ${GOSZAKUP_PW_PRESETS:-ecology,oil_spill,water_monitoring,dredging,reclamation}
      GOSZAKUP_PW_KEYWORDS: ${GOSZAKUP_PW_KEYWORDS:-нефт,очистка,рекультивация,мониторинг,утилизация,загрязн}
      GOSZAKUP_PW_MAX_ITEMS: ${GOSZAKUP_PW_MAX_ITEMS:-30}
      GOSZAKUP_PW_MAX_PAGES: ${GOSZAKUP_PW_MAX_PAGES:-5}
      GOSZAKUP_PW_FETCH_DETAIL: ${GOSZAKUP_PW_FETCH_DETAIL:-true}
      GOSZAKUP_PW_OFFLINE: ${GOSZAKUP_PW_OFFLINE:-false}
      GOSZAKUP_PW_HEADLESS: ${GOSZAKUP_PW_HEADLESS:-true}
      GOSZAKUP_PW_FILTER_NAME: ${GOSZAKUP_PW_FILTER_NAME:-}
      GOSZAKUP_PW_FILTER_CUSTOMER: ${GOSZAKUP_PW_FILTER_CUSTOMER:-}
      GOSZAKUP_PW_FILTER_NUMBER: ${GOSZAKUP_PW_FILTER_NUMBER:-}
      GOSZAKUP_PW_FILTER_YEAR: ${GOSZAKUP_PW_FILTER_YEAR:-}
      GOSZAKUP_PW_FILTER_AMOUNT_FROM: ${GOSZAKUP_PW_FILTER_AMOUNT_FROM:-1000000}
      GOSZAKUP_PW_FILTER_AMOUNT_TO: ${GOSZAKUP_PW_FILTER_AMOUNT_TO:-}
      GOSZAKUP_PW_FILTER_TRADE_TYPE: ${GOSZAKUP_PW_FILTER_TRADE_TYPE:-r}
      GOSZAKUP_PW_FILTER_TYPE: ${GOSZAKUP_PW_FILTER_TYPE:-}
      # 350 = Завершено; is_not_active = Неактивные/завершенные (не «прием заявок»)
      GOSZAKUP_PW_FILTER_STATUS: ${GOSZAKUP_PW_FILTER_STATUS:-350}
      GOSZAKUP_PW_FILTER_SIGNS: ${GOSZAKUP_PW_FILTER_SIGNS:-is_not_active}
      # Договор: Действует / Исполнен (+ Передан.*)
      GOSZAKUP_PW_CONTRACT_STATUSES: ${GOSZAKUP_PW_CONTRACT_STATUSES:-действует,исполнен}
      GOSZAKUP_PW_REQUIRE_CONTRACT_STATUS: ${GOSZAKUP_PW_REQUIRE_CONTRACT_STATUS:-true}
      GOSZAKUP_PW_REQUIRE_CONTRACT_ROWS: ${GOSZAKUP_PW_REQUIRE_CONTRACT_ROWS:-false}
      GOSZAKUP_PW_DOWNLOAD_DOCS: ${GOSZAKUP_PW_DOWNLOAD_DOCS:-true}
      GOSZAKUP_PW_MAX_DOCS: ${GOSZAKUP_PW_MAX_DOCS:-8}
      GOSZAKUP_PW_EXTRACT_ON_INGEST: ${GOSZAKUP_PW_EXTRACT_ON_INGEST:-false}
      GOSZAKUP_PW_TAB_WAIT_MS: ${GOSZAKUP_PW_TAB_WAIT_MS:-400}
      GOSZAKUP_PW_FILTER_START_DATE_FROM: ${GOSZAKUP_PW_FILTER_START_DATE_FROM:-}
      GOSZAKUP_PW_FILTER_START_DATE_TO: ${GOSZAKUP_PW_FILTER_START_DATE_TO:-}
      GOSZAKUP_PW_FILTER_END_DATE_FROM: ${GOSZAKUP_PW_FILTER_END_DATE_FROM:-}
      GOSZAKUP_PW_FILTER_END_DATE_TO: ${GOSZAKUP_PW_FILTER_END_DATE_TO:-}
      GOSZAKUP_PW_FILTER_ITOG_DATE_FROM: ${GOSZAKUP_PW_FILTER_ITOG_DATE_FROM:-}
      GOSZAKUP_PW_FILTER_ITOG_DATE_TO: ${GOSZAKUP_PW_FILTER_ITOG_DATE_TO:-}
      GOSZAKUP_PW_FILTER_SMB: ${GOSZAKUP_PW_FILTER_SMB:-}
      RUNTIME_CONFIG_PATH: /data/runtime/config.json
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-${JWT_SECRET:-change-me-in-production}}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - ./data/runtime:/data/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  celery-beat:
    build:
      context: .
      dockerfile: services/ingestion-workers/Dockerfile
    command: celery -A app.workers.celery_app beat -l INFO
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecotender}:${POSTGRES_PASSWORD:-ecotender}@postgres:5432/${POSTGRES_DB:-ecotender}
      GOSZAKUP_DAILY_ENABLED: ${GOSZAKUP_DAILY_ENABLED:-true}
      GOSZAKUP_DAILY_SOURCE_CODE: ${GOSZAKUP_DAILY_SOURCE_CODE:-KZ_GOSZAKUP_PLAYWRIGHT}
      GOSZAKUP_DAILY_HOUR: ${GOSZAKUP_DAILY_HOUR:-3}
      GOSZAKUP_DAILY_MINUTE: ${GOSZAKUP_DAILY_MINUTE:-0}
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  pgdata:
  miniodata:
  redisdata:
