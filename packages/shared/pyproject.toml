[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecotender-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "cryptography>=42",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "minio>=7.2",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecotender_shared*"]
